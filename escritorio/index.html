<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escritório Digital</title>
  <link rel="stylesheet" href="escritorio.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <strong>Lopes Araújo Advocacia</strong>
      <span>Escritório Digital</span>
    </div>
    <nav class="abas" role="tablist">
      <button role="tab" data-aba="sala" aria-selected="true">Sala</button>
      <button role="tab" data-aba="equipe">Equipe</button>
      <button role="tab" data-aba="tarefas">Tarefas</button>
      <button role="tab" data-aba="mural">Mural</button>
    </nav>
    <a class="link-crm" href="https://claude.ai/artifact/3HNhXEqp4WWjLtJ7dYUJtX" target="_blank" rel="noopener">CRM ↗</a>
  </header>

  <main>
    <section id="aba-sala" class="aba ativa" aria-label="Sala de reunião">
      <div class="sala">
        <header class="titulo-escritorio">
          <h1>Lopes Araújo <span>Advocacia</span></h1>
          <p>Escritório Digital · Advocacia Trabalhista · Dr. Adonias Lopes de Araújo — OAB/GO 50.607</p>
        </header>
        <div class="mesa-area" id="mesa-area">
          <div class="mesa"><div class="legenda" id="legenda" aria-live="polite"></div></div>
          <div id="assentos"></div>
        </div>
        <div class="controle-voz">
          <button type="button" class="btn-falar" id="btn-falar" hidden><span class="ic">🎙</span><span class="rot">Toque para falar</span></button>
          <p class="dica-voz muted" id="dica-voz"></p>
          <form class="entrada" id="form-sala" hidden>
            <textarea id="texto-sala" rows="1" placeholder="Escreva para a equipe…"></textarea>
            <button type="submit" class="btn-redondo primario" id="btn-enviar" aria-label="Enviar">➤</button>
          </form>
          <div class="barra-voz">
            <button type="button" class="btn-link" id="btn-escrever">⌨ Escrever em vez de falar</button>
            <label id="opcao-voz" hidden><input type="checkbox" id="chk-voz" checked> Ouvir em voz alta</label>
            <button type="button" class="btn-link" id="btn-parar-voz" hidden>Parar voz</button>
            <span id="aviso-voz" class="muted"></span>
          </div>
        </div>
        <div id="conversa" hidden></div>
      </div>
    </section>

    <section id="aba-equipe" class="aba" aria-label="Equipe"></section>
    <section id="aba-tarefas" class="aba" aria-label="Quadro de tarefas"></section>
    <section id="aba-mural" class="aba" aria-label="Mural de atividades"></section>
  </main>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="avatares.js"></script>
  <script src="escritorio.js"></script>
</body>
</html>
